# /etc/nginx/sites-available/bellcell
#
# TLS terminates here; the Node process binds 127.0.0.1 and is never
# reachable from outside. That is what makes the X-Forwarded-For header the
# login throttle reads trustworthy.
#
#   sudo ln -s /etc/nginx/sites-available/bellcell /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name erp.bellcell.example;
    # certbot replaces this block with a redirect once TLS is issued.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name erp.bellcell.example;

    ssl_certificate     /etc/letsencrypt/live/erp.bellcell.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.bellcell.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS is the one security header nginx sets rather than the app,
    # because it must be sent even when the app is down.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSV and Excel exports of a whole student register; the Server Action
    # body limit in next.config.ts is 8mb for lead CSV imports.
    client_max_body_size 12m;

    # The app serves its own compressed assets; let nginx compress the HTML.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    access_log /var/log/nginx/bellcell.access.log;
    error_log  /var/log/nginx/bellcell.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Overwritten, never appended: a client-supplied X-Forwarded-For
        # must not be able to spoof the address the throttle counts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Hashed filenames, so they can be cached hard and forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Let the load balancer or uptime check reach this without a session.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
